openapi: 3.1.1
info:
  title: Go QR Factorization API
  description: API for QR factorization of matrices using Gonum library
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api-go.azurecontainerapps.io
    description: Production server

paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Returns the health status of the API service
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  service:
                    type: string
                    example: "go-api"
              example:
                status: "healthy"
                service: "go-api"

  /api/login:
    post:
      tags:
        - Authentication
      summary: Generate JWT token
      description: Generates a JWT token for authenticated requests
      operationId: postLogin
      requestBody:
        description: Optional credentials (if needed)
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "test-user"
                password:
                  type: string
                  example: "test-password"
            example:
              username: "test-user"
              password: "test-password"
      responses:
        '200':
          description: JWT token generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT Bearer token
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/qr-factorization:
    post:
      tags:
        - QR Factorization
      summary: Compute QR factorization
      description: Performs QR decomposition on a given matrix using Gonum library. Requires JWT authentication. Returns QR matrices with optional statistics from Node.js API.
      operationId: postQRFactorization
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: Matrix data to factorize
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatrixRequest'
            example:
              matrix: [[1, 2], [3, 4], [5, 6]]
      responses:
        '200':
          description: QR factorization computed successfully with optional statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRFactorizationResponse'
              example:
                qr:
                  q: [[0.169, 0.886], [0.507, 0.425], [0.845, -0.037]]
                  r: [[5.916, 7.086], [0, 1.048]]
                statistics:
                  statistics:
                    maxValue: 7.086
                    minValue: -0.037
        '400':
          description: Invalid matrix data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    MatrixRequest:
      type: object
      required:
        - matrix
      properties:
        matrix:
          type: array
          items:
            type: array
            items:
              type: number
          description: 2D array representing the matrix to factorize
          minItems: 1
          example: [[1, 2], [3, 4], [5, 6]]

    QRResponse:
      type: object
      required:
        - q
        - r
      properties:
        q:
          type: array
          items:
            type: array
            items:
              type: number
          description: Orthogonal matrix Q from QR decomposition
          example: [[0.169, 0.886], [0.507, 0.425], [0.845, -0.037]]
        r:
          type: array
          items:
            type: array
            items:
              type: number
          description: Upper triangular matrix R from QR decomposition
          example: [[5.916, 7.086], [0, 1.048]]

    QRFactorizationResponse:
      type: object
      required:
        - qr
      properties:
        qr:
          $ref: '#/components/schemas/QRResponse'
          description: QR matrices from factorization
        statistics:
          type: object
          nullable: true
          description: Optional statistics from Node.js API (null if API is unavailable)
          properties:
            statistics:
              type: object
              properties:
                maxValue:
                  type: number
                minValue:
                  type: number
                average:
                  type: number
                sum:
                  type: number
                totalValues:
                  type: integer
                diagonalMatrices:
                  type: array
                  items:
                    type: boolean
                matrixNames:
                  type: array
                  items:
                    type: string
            matrices:
              type: object
              properties:
                q:
                  type: array
                  items:
                    type: array
                    items:
                      type: number
                r:
                  type: array
                  items:
                    type: array
                    items:
                      type: number
                original:
                  type: array
                  items:
                    type: array
                    items:
                      type: number

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message description
          example: "Invalid matrix data provided"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authentication. Obtain token from /api/login endpoint.
